<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wolfy World: Dig For Treasures (Multiplayer)</title>
    <!-- Librería PeerJS para multiplayer sin servidor propio -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #1a1a2e; color: #e0e0e0; text-align: center; }
        h1 { color: #f1c40f; }
        .screen { display: none; max-width: 900px; margin: 0 auto; padding: 20px; }
        .active { display: block; }
        
        #game-area { 
            width: 100%; height: 500px; background: #16213e; 
            border: 4px solid #f39c12; position: relative; overflow: hidden; 
        }
        
        .player-dot { 
            width: 40px; height: 40px; position: absolute; 
            border-radius: 50%; border: 2px solid white; 
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            transition: all 0.2s ease-out;
        }

        /* Minijuego Barra */
        #mining-ui {
            width: 400px; height: 50px; background: #333; 
            margin: 20px auto; position: relative; border: 3px solid #fff;
            display: none; cursor: pointer;
        }
        #target-zone { width: 60px; height: 100%; background: #2ecc71; position: absolute; left: 170px; opacity: 0.8; }
        #cursor { width: 10px; height: 100%; background: #f1c40f; position: absolute; left: 0; }

        #ui-panel { background: #0f3460; padding: 15px; margin-top: 10px; border-radius: 10px; }
        button { padding: 10px; margin: 5px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .shovel-btn { background: #3498db; }
        input { padding: 10px; border-radius: 5px; border: none; }
    </style>
</head>
<body>

    <!-- Pantalla de Conexión -->
    <div id="login-screen" class="screen active">
        <h1>🐺 Wolfy World: Multiplayer</h1>
        <input type="text" id="username" placeholder="Nombre de Lobito" value="Lobito Gamma">
        <br><br>
        <button onclick="createRoom()">🏠 Crear Sala (Host)</button>
        <p>- O -</p>
        <input type="text" id="room-id-input" placeholder="ID de la Sala">
        <button onclick="joinRoom()">🚪 Unirse a Sala</button>
        <p id="status-msg">Esperando conexión...</p>
    </div>

    <!-- Pantalla de Juego -->
    <div id="game-screen" class="screen">
        <h2>Sala ID: <span id="display-room-id">...</span></h2>
        <div id="game-area"></div>
        
        <div id="mining-ui">
            <div id="target-zone"></div>
            <div id="cursor"></div>
        </div>
        <button id="dig-btn" onclick="startMining()">⛏️ Excavar</button>

        <div id="ui-panel">
            <p>💰 <span id="money">0</span> PE | 🔨 <span id="shovel-name">Juguete</span></p>
            <button onclick="sellItem()">Vender Tesoro</button>
            <hr>
            <button class="shovel-btn" onclick="buyShovel('training')">Entrenamiento (100 PE)</button>
            <button class="shovel-btn" onclick="buyShovel('iron')">Hierro (500 PE)</button>
            <button class="shovel-btn" onclick="buyShovel('steel')">Acero (1500 PE)</button>
            <h3>Inventario:</h3>
            <ul id="inv-list" style="list-style: none;"></ul>
        </div>
    </div>

    <script>
        let peer;
        let conn; // Conexión con el host
        let myId;
        let isHost = false;
        let connections = []; // Lista de conexiones si eres host
        
        // Estado del juego local
        let myData = { name: "Lobito", money: 0, shovel: 'toy', inventory: [], x: 100, y: 100, color: '#e74c3c' };
        let otherPlayers = {}; // Datos de otros jugadores
        let miningActive = false;
        let cursorPos = 0;
        let cursorDir = 1;
        let miningInterval;

        const SHOVELS = {
            toy: { name: "Juguete", power: 1 },
            training: { name: "Entrenamiento", power: 2, cost: 100 },
            iron: { name: "Hierro", power: 5, cost: 500 },
            steel: { name: "Acero", power: 10, cost: 1500 }
        };

        // --- Lógica de Red (PeerJS) ---
        function initPeer() {
            peer = new Peer(); // Crea un ID automático
            
            peer.on('open', (id) => {
                myId = id;
                document.getElementById('status-msg').innerText = "Listo. Tu ID: " + id;
            });

            // Si alguien se conecta a ti (Eres Host)
            peer.on('connection', (c) => {
                if(connections.length >= 5) { c.close(); return; } // Max 6 total
                connections.push(c);
                setupConnection(c);
                
                // Enviar estado actual al nuevo jugador
                c.on('open', () => {
                    c.send({ type: 'init', hostData: myData, others: otherPlayers });
                    broadcast({ type: 'playerJoined', player: myData });
                });
            });
        }

        function setupConnection(c) {
            c.on('data', (data) => handleData(data, c.peer));
            c.on('close', () => {
                delete otherPlayers[c.peer];
                renderPlayers();
                if(isHost) broadcast({ type: 'playerLeft', id: c.peer });
            });
        }

        function handleData(data, senderId) {
            if (data.type === 'updateState') {
                otherPlayers[senderId] = data.state;
                renderPlayers();
            } else if (data.type === 'chat' || data.type === 'trade') {
                // Lógica futura para trade
            }
        }

        function broadcast(data) {
            connections.forEach(c => c.send(data));
        }

        function sendToHost(data) {
            if(conn) conn.send(data);
        }

        // --- Funciones de UI ---
        function createRoom() {
            isHost = true;
            myData.name = document.getElementById('username').value;
            initPeer();
            setTimeout(() => {
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('game-screen').classList.add('active');
                document.getElementById('display-room-id').innerText = myId;
                renderPlayers();
            }, 1000);
        }

        function joinRoom() {
            const hostId = document.getElementById('room-id-input').value;
            myData.name = document.getElementById('username').value;
            
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(hostId);
                setupConnection(conn);
                
                conn.on('open', () => {
                    document.getElementById('login-screen').classList.remove('active');
                    document.getElementById('game-screen').classList.add('active');
                    document.getElementById('display-room-id').innerText = hostId;
                });
            });
        }

        // --- Lógica del Juego ---
        function updateMyState() {
            const state = { ...myData };
            if (isHost) broadcast({ type: 'updateState', state: state });
            else sendToHost({ type: 'updateState', state: state });
            renderPlayers();
            updateUI();
        }

        function renderPlayers() {
            const area = document.getElementById('game-area');
            area.innerHTML = '';
            
            // Dibujarme a mí
            drawPlayer(myData.x, myData.y, myData.color, myData.name + " (Tú)");
            
            // Dibujar a otros
            for (let id in otherPlayers) {
                let p = otherPlayers[id];
                drawPlayer(p.x, p.y, p.color, p.name);
            }
        }

        function drawPlayer(x, y, color, label) {
            let dot = document.createElement('div');
            dot.className = 'player-dot';
            dot.style.backgroundColor = color;
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
            dot.innerText = "🐺";
            dot.title = label;
            document.getElementById('game-area').appendChild(dot);
        }

        // Movimiento simple con click en el área
        document.getElementById('game-area').addEventListener('click', (e) => {
            const rect = e.target.getBoundingClientRect();
            myData.x = e.clientX - rect.left - 20;
            myData.y = e.clientY - rect.top - 20;
            updateMyState();
        });

        // --- Minijuego y Economía ---
        function startMining() {
            if(miningActive) return;
            miningActive = true;
            document.getElementById('mining-ui').style.display = 'block';
            document.getElementById('dig-btn').style.display = 'none';
            
            miningInterval = setInterval(() => {
                cursorPos += 6 * cursorDir;
                if(cursorPos >= 390 || cursorPos <= 0) cursorDir *= -1;
                document.getElementById('cursor').style.left = cursorPos + 'px';
            }, 20);
        }

        function stopMining() {
            if(!miningActive) return;
            clearInterval(miningInterval);
            miningActive = false;
            document.getElementById('mining-ui').style.display = 'none';
            document.getElementById('dig-btn').style.display = 'inline-block';

            // Zona verde: 170 a 230
            if(cursorPos >= 170 && cursorPos <= 230) {
                myData.inventory.push({ name: 'Gema', value: 20 });
                alert("¡Tesoro encontrado!");
            } else {
                alert("Fallaste...");
            }
            updateMyState();
        }

        document.getElementById('mining-ui').addEventListener('click', stopMining);

        function sellItem() {
            if(myData.inventory.length > 0) {
                let item = myData.inventory.pop();
                myData.money += item.value;
                updateMyState();
            }
        }

        function buyShovel(type) {
            let cost = SHOVELS[type].cost;
            if(myData.money >= cost) {
                myData.money -= cost;
                myData.shovel = type;
                updateMyState();
            }
        }

        function updateUI() {
            document.getElementById('money').innerText = myData.money;
            document.getElementById('shovel-name').innerText = SHOVELS[myData.shovel].name;
            let list = document.getElementById('inv-list');
            list.innerHTML = '';
            myData.inventory.forEach(i => {
                let li = document.createElement('li');
                li.innerText = i.name + " (" + i.value + " PE)";
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
