<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wolfy World: Dig For Treasures</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Verdana', sans-serif; background-color: #2c3e50; color: white; text-align: center; }
        .screen { display: none; } .active { display: block; }
        
        #game-area { width: 800px; height: 500px; background: #34495e; margin: 20px auto; position: relative; border: 5px solid #f1c40f; overflow: hidden; }
        .player { width: 40px; height: 40px; background: #e74c3c; position: absolute; border-radius: 50%; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.2s; }
        
        #mining-bar { width: 300px; height: 30px; background: #000; margin: 10px auto; position: relative; display: none; border: 2px solid white; cursor: pointer; }
        #green-zone { width: 50px; height: 100%; background: #2ecc71; position: absolute; left: 125px; opacity: 0.7; }
        #cursor { width: 10px; height: 100%; background: #f1c40f; position: absolute; left: 0; }

        button { padding: 10px 20px; margin: 5px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        input { padding: 10px; border-radius: 5px; border: none; }
        #room-info { background: #e67e22; padding: 5px; display: inline-block; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div id="login-screen" class="screen active">
        <h1>🐺 Wolfy World: Dig For Treasures</h1>
        <p>Introduce tu nombre y un Código de Sala (ej: LOBO1)</p>
        <input type="text" id="username" placeholder="Nombre (ej: Lobito Gamma)" value="Lobito Gamma"><br><br>
        <input type="text" id="room-code" placeholder="Código de Sala (ej: LOBO1)" value="LOBO1"><br><br>
        <button onclick="hostGame()">🏠 Crear Sala (Host)</button>
        <button onclick="joinGame()">🚪 Unirse a Sala</button>
        <p id="status" style="color: #f1c40f;"></p>
    </div>

    <!-- Pantalla de Juego -->
    <div id="game-screen" class="screen">
        <div id="room-info">Sala: <span id="current-room"></span></div>
        <div id="game-area" onclick="movePlayer(event)"></div>
        
        <div id="mining-bar">
            <div id="green-zone"></div>
            <div id="cursor"></div>
        </div>
        <button id="btn-dig" onclick="startMining()">⛏️ Excavar</button>

        <div style="background: #2c3e50; padding: 10px;">
            <p>💰 <span id="money">0</span> PE | 🔨 <span id="shovel">Juguete</span></p>
            <button onclick="sellItem()">Vender Tesoro</button>
            <hr>
            <button onclick="buyShovel('training')">Pala Entrenamiento (100 PE)</button>
            <button onclick="buyShovel('iron')">Pala Hierro (500 PE)</button>
            <button onclick="buyShovel('steel')">Pala Acero (1500 PE)</button>
            <ul id="inv" style="list-style: none;"></ul>
        </div>
    </div>

    <script>
        let peer;
        let conn; 
        let myId;
        let isHost = false;
        let connections = [];
        
        // Datos del jugador
        let me = { name: "", money: 0, shovel: 'toy', inventory: [], x: 380, y: 230, color: '#f1c40f' };
        let others = {};
        
        // Minijuego
        let mining = false;
        let pos = 0; 
        let dir = 1;
        let interval;

        const SHOVELS = {
            toy: { n: "Juguete", p: 1 },
            training: { n: "Entrenamiento", p: 2, c: 100 },
            iron: { n: "Hierro", p: 5, c: 500 },
            steel: { n: "Acero", p: 10, c: 1500 }
        };

        function initPeer(customId) {
            // Usamos el código de sala como parte del ID para evitar colisiones
            const finalId = "wolfy-" + customId + "-" + Math.floor(Math.random() * 1000);
            peer = new Peer(finalId);

            peer.on('open', (id) => {
                myId = id;
                document.getElementById('status').innerText = "Conectado al Rift...";
                
                if(isHost) {
                    startHostLogic(customId);
                }
            });

            peer.on('connection', (c) => {
                if(connections.length >= 5) { c.close(); return; }
                connections.push(c);
                handleConnection(c);
                
                // Enviar estado inicial al que se une
                c.on('open', () => {
                    c.send({ type: 'init', host: me, others: others });
                    broadcast({ type: 'newPlayer', p: me });
                });
            });
            
            peer.on('error', (err) => {
                document.getElementById('status').innerText = "Error: " + err.type;
            });
        }

        function handleConnection(c) {
            c.on('data', (data) => {
                if(data.type === 'update') {
                    others[data.id] = data.p;
                    drawPlayers();
                }
            });
            c.on('close', () => {
                delete others[c.peer];
                drawPlayers();
            });
        }

        function broadcast(data) {
            connections.forEach(c => c.send(data));
        }

        function hostGame() {
            isHost = true;
            me.name = document.getElementById('username').value || "Host";
            const room = document.getElementById('room-code').value.toUpperCase();
            document.getElementById('current-room').innerText = room;
            
            // Creamos un ID basado en la sala para que sea más fácil de encontrar si quisiéramos buscarlo
            initPeer(room + "-HOST");
            
            setTimeout(() => {
                switchScreen();
            }, 1500);
        }

        function joinGame() {
            me.name = document.getElementById('username').value || "Guest";
            const room = document.getElementById('room-code').value.toUpperCase();
            const hostId = room + "-HOST";
            
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(hostId);
                handleConnection(conn);
                
                conn.on('open', () => {
                    switchScreen();
                    document.getElementById('current-room').innerText = room;
                });
                
                conn.on('data', (data) => {
                    if(data.type === 'init') {
                        // Recibir datos del host
                        me.money = 0; // Reiniciar dinero localmente o sincronizar
                        drawPlayers();
                    }
                    if(data.type === 'newPlayer') {
                        others[data.p.id || 'guest'] = data.p;
                        drawPlayers();
                    }
                });
            });
        }

        function switchScreen() {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            drawPlayers();
            updateUI();
        }

        // --- Lógica Visual y de Juego ---
        function drawPlayers() {
            const area = document.getElementById('game-area');
            area.innerHTML = '';
            
            // Dibujarme
            createDot(me.x, me.y, me.color, me.name + " (Tú)");
            
            // Dibujar otros
            for(let id in others) {
                let p = others[id];
                createDot(p.x, p.y, p.color, p.name);
            }
        }

        function createDot(x, y, color, label) {
            let d = document.createElement('div');
            d.className = 'player';
            d.style.left = x + 'px';
            d.style.top = y + 'px';
            d.style.backgroundColor = color;
            d.innerText = "🐺";
            d.title = label;
            document.getElementById('game-area').appendChild(d);
        }

        function movePlayer(e) {
            const rect = e.target.getBoundingClientRect();
            me.x = e.clientX - rect.left - 20;
            me.y = e.clientY - rect.top - 20;
            
            // Enviar movimiento
            let data = { type: 'update', id: myId, p: me };
            if(isHost) broadcast(data);
            else if(conn) conn.send(data);
            
            drawPlayers();
        }

        // --- Minijuego y Economía ---
        function startMining() {
            if(mining) return;
            mining = true;
            document.getElementById('mining-bar').style.display = 'block';
            document.getElementById('btn-dig').style.display = 'none';
            
            interval = setInterval(() => {
                pos += 5 * dir;
                if(pos > 290 || pos < 0) dir *= -1;
                document.getElementById('cursor').style.left = pos + 'px';
            }, 20);
        }

        function stopMining() {
            if(!mining) return;
            clearInterval(interval);
            mining = false;
            document.getElementById('mining-bar').style.display = 'none';
            document.getElementById('btn-dig').style.display = 'inline-block';
            
            // Zona verde: 125 a 175
            if(pos >= 125 && pos <= 175) {
                me.inventory.push({n: "Gema", v: 20});
                alert("¡Tesoro!");
            } else {
                alert("Fallaste...");
            }
            sendUpdate();
        }

        document.getElementById('mining-bar').addEventListener('click', stopMining);

        function sellItem() {
            if(me.inventory.length > 0) {
                let item = me.inventory.pop();
                me.money += item.v;
                sendUpdate();
            }
        }

        function buyShovel(type) {
            let s = SHOVELS[type];
            if(me.money >= s.c) {
                me.money -= s.c;
                me.shovel = type;
                sendUpdate();
            }
        }

        function sendUpdate() {
            updateUI();
            let data = { type: 'update', id: myId, p: me };
            if(isHost) broadcast(data);
            else if(conn) conn.send(data);
        }

        function updateUI() {
            document.getElementById('money').innerText = me.money;
            document.getElementById('shovel').innerText = SHOVELS[me.shovel].n;
            let list = document.getElementById('inv');
            list.innerHTML = '';
            me.inventory.forEach(i => {
                let li = document.createElement('li');
                li.innerText = i.n + " (" + i.v + " PE)";
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
