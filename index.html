<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Wolfy World: Dig For Treasures</title>
    <!-- Librerías externas -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <!-- CSS propio -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Pantalla de Inicio -->
    <div id="login-screen" class="screen active">
        <h1>🐺 Wolfy World: Dig For Treasures</h1>
        <p>Introduce tu nombre y Código de Sala</p>
        <input type="text" id="username" placeholder="Nombre (ej: Lobito Gamma)" value="Lobito Gamma"><br><br>
        <input type="text" id="room-code" placeholder="Código de Sala (ej: LOBO1)" value="LOBO1"><br><br>
        
        <div class="mode-selector">
            <label><input type="radio" name="net-mode" value="p2p" checked> 🌐 P2P (Sin Servidor)</label>
            <label><input type="radio" name="net-mode" value="server"> ☁️ Servidor (Requiere backend)</label>
        </div>
        <br>
        <button onclick="app.startGame()">▶️ Entrar al Mundo</button>
        <p id="status" style="color: #f1c40f;"></p>
    </div>

    <!-- Pantalla de Juego -->
    <div id="game-screen" class="screen">
        <header>
            <div id="room-info">Sala: <span id="current-room"></span></div>
            <div id="player-list">Jugadores online: 1</div>
        </header>
        
        <div id="game-area" onclick="app.handleAreaClick(event)">
            <!-- Los jugadores se dibujan aquí dinámicamente -->
        </div>
        
        <div id="mining-bar">
            <div id="green-zone"></div>
            <div id="cursor"></div>
        </div>
        <button id="btn-dig" onclick="app.toggleMining()">⛏️ Excavar / Parar</button>

        <footer>
            <div class="stats">
                💰 <span id="money">0</span> PE | 🔨 <span id="shovel-name">Juguete</span>
            </div>
            <div class="actions">
                <button onclick="app.sellItem()">Vender Tesoro</button>
                <hr>
                <button onclick="app.buyShovel('training')">Entrenamiento (100 PE)</button>
                <button onclick="app.buyShovel('iron')">Hierro (500 PE)</button>
                <button onclick="app.buyShovel('steel')">Acero (1500 PE)</button>
            </div>
            <ul id="inventory-list" class="inventory"></ul>
        </footer>
    </div>

    <!-- Scripts modulares -->
    <script src="game-state.js"></script>
    <script src="network-manager.js"></script>
    <script src="main.js"></script>
</body>
</html>
